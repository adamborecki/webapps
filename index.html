<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="color-scheme" content="dark light" />
  <meta name="theme-color" content="#101825" />
  <meta
    name="description"
    content="Adam Borecki's live web apps: music-tech demos, practical tools, and visual experiments."
  />
  <title>Adam Borecki | Web Apps</title>

  <style>
    :root{
      --bg0:#101825;
      --bg1:#162131;
      --ink:#f5efe6;
      --muted:rgba(245,239,230,.72);
      --muted-2:rgba(245,239,230,.54);
      --panel:rgba(255,255,255,.07);
      --panel-2:rgba(255,255,255,.05);
      --stroke:rgba(255,255,255,.14);
      --stroke-2:rgba(255,255,255,.10);
      --accent:#ff8a3d;
      --accent-2:#5dd2ff;
      --accent-3:#fff0b3;
      --ok:#80f0c6;
      --shadow:0 24px 64px rgba(0,0,0,.33);
      --radius-lg:22px;
      --radius-md:16px;
      --radius-sm:12px;
      --tap:44px;
      --display:"Avenir Next Condensed","Trebuchet MS","Gill Sans","Segoe UI",sans-serif;
      --sans:"Avenir Next","Trebuchet MS","Helvetica Neue","Segoe UI",sans-serif;
      --mono:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;
    }

    @media (prefers-color-scheme: light){
      :root{
        --bg0:#f7f3eb;
        --bg1:#ebe4d8;
        --ink:#1a2230;
        --muted:rgba(26,34,48,.72);
        --muted-2:rgba(26,34,48,.56);
        --panel:rgba(255,255,255,.6);
        --panel-2:rgba(255,255,255,.42);
        --stroke:rgba(26,34,48,.12);
        --stroke-2:rgba(26,34,48,.09);
        --shadow:0 22px 54px rgba(68,49,24,.12);
      }
    }

    *{ box-sizing:border-box }
    html{ scroll-behavior:smooth }
    html,body{ min-height:100% }
    body{
      margin:0;
      color:var(--ink);
      font-family:var(--sans);
      background:
        radial-gradient(1000px 580px at 12% 0%, rgba(255,138,61,.16), transparent 60%),
        radial-gradient(900px 540px at 88% 8%, rgba(93,210,255,.14), transparent 58%),
        linear-gradient(180deg, var(--bg0), var(--bg1));
      overflow-x:hidden;
    }

    a{ color:inherit; text-decoration:none }
    img{ display:block; max-width:100% }

    .wrap{
      width:min(1160px, calc(100% - 32px));
      margin:0 auto;
      position:relative;
      z-index:1;
    }

    /* ---------- header ---------- */
    header{
      position:sticky;
      top:0;
      z-index:20;
      border-bottom:1px solid var(--stroke-2);
      backdrop-filter:blur(18px);
      -webkit-backdrop-filter:blur(18px);
      background:linear-gradient(180deg, rgba(16,24,37,.78), rgba(16,24,37,.42));
    }

    @media (prefers-color-scheme: light){
      header{
        background:linear-gradient(180deg, rgba(247,243,235,.82), rgba(247,243,235,.5));
      }
    }

    .nav{
      width:min(1160px, calc(100% - 32px));
      margin:0 auto;
      padding:14px 0;
      display:flex;
      gap:14px;
      align-items:center;
      justify-content:space-between;
    }

    .brand-mark{
      font:700 .95rem/1 var(--display);
      letter-spacing:.06em;
      text-transform:uppercase;
    }

    .icon-link{
      width:38px;
      height:38px;
      border-radius:50%;
      border:1px solid var(--stroke);
      background:rgba(255,255,255,.05);
      display:flex;
      align-items:center;
      justify-content:center;
      transition:transform .15s ease, border-color .15s ease;
    }
    .icon-link:hover{ transform:translateY(-1px); border-color:rgba(255,255,255,.28) }
    .icon-link svg{ width:18px; height:18px }

    /* ---------- shared section chrome ---------- */
    .section{
      padding:64px 0;
    }

    .section-head{
      text-align:center;
      margin-bottom:36px;
    }

    .section-head .eyebrow{
      margin:0 0 10px;
      font:700 12px/1 var(--mono);
      letter-spacing:.2em;
      text-transform:uppercase;
      color:var(--accent-2);
    }

    .section-head h2{
      margin:0 auto;
      max-width:24ch;
      font-family:var(--display);
      font-size:clamp(1.8rem, 4vw, 2.6rem);
      line-height:1.05;
      text-transform:uppercase;
      letter-spacing:.01em;
    }

    .section-head p{
      margin:14px auto 0;
      max-width:56ch;
      font-size:1rem;
      line-height:1.55;
      color:var(--muted);
    }

    /* ---------- details (search / filter / everything) ---------- */
    .details{
      padding-top:40px;
    }

    .details-controls{
      display:grid;
      gap:14px;
      margin-bottom:28px;
    }

    @media (min-width: 760px){
      .details-controls{
        grid-template-columns:minmax(0, 1fr) auto;
        align-items:start;
      }

      .search-row{
        grid-column:1 / -1;
      }

      .filter-groups{
        grid-column:1 / 2;
      }

      .btn-bulk{
        grid-column:2 / 3;
        align-self:end;
      }
    }

    .search-row{
      display:flex;
      align-items:center;
      gap:10px;
      padding:0 16px;
      min-height:50px;
      border-radius:14px;
      border:1px solid var(--stroke);
      background:rgba(0,0,0,.14);
    }

    @media (prefers-color-scheme: light){
      .search-row{ background:rgba(255,255,255,.55) }
    }

    .search-row input{
      width:100%;
      border:none;
      outline:none;
      background:transparent;
      color:var(--ink);
      font:500 .95rem/1.2 var(--sans);
    }

    .filter-groups{
      display:grid;
      gap:12px;
    }

    .filter-group{
      display:grid;
      gap:8px;
    }

    .filter-label{
      font:700 11px/1 var(--mono);
      letter-spacing:.12em;
      text-transform:uppercase;
      color:var(--muted-2);
    }

    .pill-row{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
    }

    .pill{
      padding:8px 13px;
      border-radius:999px;
      border:1px solid var(--stroke-2);
      background:rgba(255,255,255,.05);
      color:var(--muted);
      font:600 .8rem/1 var(--sans);
      cursor:pointer;
      transition:transform .14s ease, border-color .14s ease, background .14s ease, color .14s ease;
      white-space:nowrap;
    }

    .pill:hover{
      transform:translateY(-1px);
      color:var(--ink);
      border-color:rgba(255,255,255,.23);
    }

    .pill.active{
      color:var(--ink);
      border-color:rgba(93,210,255,.35);
      background:rgba(93,210,255,.12);
    }

    .btn-bulk{
      min-height:50px;
      padding:0 16px;
      border-radius:14px;
      border:1px solid var(--stroke);
      background:rgba(255,255,255,.06);
      color:var(--ink);
      font:600 .88rem/1 var(--sans);
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      cursor:pointer;
      white-space:nowrap;
      transition:transform .14s ease, border-color .14s ease;
    }
    .btn-bulk:hover{ transform:translateY(-1px); border-color:rgba(255,255,255,.24) }

    .result-summary,
    .status{
      font-size:.85rem;
      color:var(--muted-2);
    }
    .status:empty{ display:none }

    .table-shell{
      overflow-x:auto;
      border:1px solid var(--stroke);
      border-radius:18px;
      background:linear-gradient(180deg, var(--panel), var(--panel-2));
      box-shadow:var(--shadow);
    }

    .app-table{
      width:100%;
      border-collapse:collapse;
      min-width:840px;
    }

    .app-table th,
    .app-table td{
      padding:16px 18px;
      text-align:left;
      vertical-align:top;
      border-bottom:1px solid var(--stroke-2);
    }

    .app-table thead th{
      position:sticky;
      top:67px;
      z-index:1;
      background:rgba(16,24,37,.94);
      backdrop-filter:blur(12px);
      -webkit-backdrop-filter:blur(12px);
      font:700 11px/1 var(--mono);
      letter-spacing:.12em;
      text-transform:uppercase;
      color:var(--muted-2);
    }

    @media (prefers-color-scheme: light){
      .app-table thead th{
        background:rgba(247,243,235,.96);
      }
    }

    .app-table tbody tr:last-child td{
      border-bottom:none;
    }

    .app-cell{
      min-width:0;
    }

    .app-main{
      display:flex;
      align-items:flex-start;
      gap:12px;
    }

    .row-thumb{
      width:48px;
      height:48px;
      border-radius:12px;
      overflow:hidden;
      flex:0 0 auto;
      display:flex;
      align-items:center;
      justify-content:center;
      background:rgba(255,255,255,.05);
      border:1px solid var(--stroke-2);
      font-size:1.3rem;
    }
    .row-thumb img{ width:100%; height:100%; object-fit:cover }

    .app-title{
      margin:0;
      font-size:1rem;
      font-weight:800;
      letter-spacing:.005em;
    }

    .app-desc{
      margin:7px 0 0;
      color:var(--muted);
      font-size:.9rem;
      line-height:1.45;
      max-width:62ch;
    }

    .badge-row{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      margin-top:10px;
    }

    .badge{
      display:inline-flex;
      align-items:center;
      min-height:24px;
      padding:0 10px;
      border-radius:999px;
      border:1px solid var(--stroke);
      background:rgba(255,255,255,.05);
      font:700 11px/1 var(--mono);
      letter-spacing:.04em;
      text-transform:uppercase;
      color:var(--muted);
      white-space:nowrap;
    }

    .badge-chapman{
      color:var(--ink);
      border-color:rgba(255,138,61,.34);
      background:rgba(255,138,61,.12);
    }

    .badge-featured{
      color:var(--ink);
      border-color:rgba(93,210,255,.34);
      background:rgba(93,210,255,.12);
    }

    .badge-archive{
      border-color:rgba(255,240,179,.28);
      background:rgba(255,240,179,.1);
    }

    .table-meta{
      font-size:.9rem;
      line-height:1.4;
      color:var(--muted);
    }

    .table-meta strong{
      display:block;
      margin-bottom:4px;
      color:var(--ink);
      font-size:.82rem;
      font-weight:700;
      letter-spacing:.08em;
      text-transform:uppercase;
    }

    .row-actions{
      display:flex;
      flex-direction:column;
      align-items:flex-start;
      gap:10px;
    }

    .row-actions a{
      font:600 .84rem/1 var(--sans);
      color:var(--muted);
      transition:color .15s ease;
      white-space:nowrap;
    }
    .row-actions a:hover{ color:var(--ink) }

    .empty{
      padding:40px 20px;
      text-align:center;
      color:var(--muted);
    }

    .hide{ display:none !important }

    footer{
      padding:32px 0 56px;
      text-align:center;
      font-size:.85rem;
      color:var(--muted-2);
    }

    @media (prefers-reduced-motion: reduce){
      html{ scroll-behavior:auto }
      .pill,
      .btn-bulk,
      .icon-link{
        transition:none;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="nav">
      <span class="brand-mark">Adam Borecki</span>
      <a class="icon-link" href="https://github.com/adamborecki" target="_blank" rel="noreferrer" title="GitHub">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M9 19c-4 1-4-2-6-2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <path d="M15 19v-3c0-1 .2-1.7.7-2.2 2.3-.3 4.8-1.1 4.8-5.1 0-1.1-.4-2.1-1.1-2.9.1-.3.5-1.5-.1-3.1 0 0-.9-.3-3 1.1-.9-.2-1.8-.3-2.8-.3s-1.9.1-2.8.3c-2.1-1.4-3-1.1-3-1.1-.6 1.6-.2 2.8-.1 3.1C5.9 6.4 5.5 7.4 5.5 8.5c0 4 2.5 4.8 4.8 5.1.4.4.7 1 .7 2v3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </a>
    </div>
  </header>

  <main>
    <section class="section details">
      <div class="wrap">
        <div class="section-head">
          <p class="eyebrow">Catalog</p>
          <h2>Live Web Apps</h2>
          <p>A fast table for browsing, filtering, and opening every live app.</p>
        </div>

        <div class="details-controls">
          <div class="search-row">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="opacity:.85">
              <path d="M11 19a8 8 0 1 1 0-16 8 8 0 0 1 0 16Z" stroke="currentColor" stroke-width="2"/>
              <path d="M21 21l-4.3-4.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
            <input id="q" type="search" placeholder="Try: compression, uke, focus, hopfield" autocomplete="off" />
          </div>
          <div class="filter-groups">
            <div class="filter-group">
              <span class="filter-label">Category</span>
              <div class="pill-row" id="sectionPills"></div>
            </div>
            <div class="filter-group">
              <span class="filter-label">Focus</span>
              <div class="pill-row" id="focusPills"></div>
            </div>
          </div>
          <button class="btn-bulk" id="btnOpenVisible" type="button" title="Open one visible app and copy the rest">
            Open visible
          </button>
        </div>

        <div class="result-summary" id="resultSummary" style="margin-bottom:8px"></div>
        <div class="status" id="status" aria-live="polite" style="margin-bottom:8px"></div>

        <div class="table-shell">
          <table class="app-table" aria-describedby="resultSummary">
            <thead>
              <tr>
                <th scope="col">App</th>
                <th scope="col">Category</th>
                <th scope="col">Status</th>
                <th scope="col">Links</th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
        <div class="empty hide" id="emptyState">No apps match that search yet.</div>
      </div>
    </section>

    <footer>
      Live apps only — in-progress repos stay off this page until they have a public demo.
    </footer>
  </main>

  <script>
    const USER = "adamborecki";
    const PAGES_ROOT = `https://${USER}.github.io`;

    const SECTION_FILTERS = [
      { id: "all", label: "All" },

      { id: "tools", label: "Practical Tools" },

    const FOCUS_FILTERS = [

      { id: "current", label: "Current" },
      { id: "archive", label: "Legacy / Archive" },
      { id: "multi", label: "Multi-Part" }
    ];

    const SECTIONS = [
      {
        id: "classroom",
        label: "Tech Education",
        description: "Audio-concept demos and quiz reviews built for classroom use."
      },
      {
        id: "instruments",
        label: "Instruments & Effects",

      {
        id: "tools",

      },
      {
        id: "education",
        label: "Multi-Discipline Ed",
        description: "Listening guides and teaching demos outside audio engineering."
      },
      {
        id: "concept",
        label: "Concept & Visual",
        description: "Neural nets and museum-inspired light and motion, kept for fun."
      }
    ];

    const APPS = [
      { repo:"mod-fx", title:"Mod FX", desc:"Chorus, flanger, and phaser in one interactive modulation-effects web app.", section:"classroom", kind:"single", featured:true, emoji:"🌊", thumb:"mod-fx" },
      { repo:"harmonic-series-builder-gen3", title:"Harmonic Series Builder", desc:"Interactive harmonic-series practice with a notation-minded learning flow.", section:"classroom", kind:"single", featured:true, emoji:"🎼", thumb:"harmonic-series-builder-gen3" },
      { repo:"harmonics", title:"Harmonics", desc:"Two ways into the harmonic series: a listening experiment for the big picture, then the notation builder for practice.", section:"classroom", kind:"multi", featured:true, emoji:"🎶", thumb:null },
      { repo:"gain-staging", title:"Gain Staging", desc:"An interactive guide to gain structure — from preamp to master bus.", section:"classroom", kind:"single", featured:true, emoji:"📶", thumb:"gain-staging" },

      { repo:"mus244-unit1", title:"MUS 244 Unit 1 Slides", desc:"A 205-slide lecture deck for MUS 244 Unit 1 — Acoustics & Synthesis, with linked follow-along notes.", section:"classroom", kind:"single", featured:false, emoji:"📽️", thumb:null },
      { repo:"sound-lab", title:"Sound Lab", desc:"A museum-floor style acoustics lab — touch-and-listen stations on frequency, amplitude, periodicity, and more.", section:"classroom", kind:"single", featured:false, emoji:"🔬", thumb:null },
      { repo:"salmon", title:"Salmon", desc:"A point-and-click live-sound simulator for signal flow, troubleshooting, and concert-recording workflows in Salmon Recital Hall.", section:"classroom", kind:"single", featured:false, emoji:"🐟", thumb:null },
      { repo:"mixer-lab", title:"Mixer Lab", desc:"A live-sound mixer simulator where students patch stems, build FOH and monitor mixes, and trace the signal path.", section:"classroom", kind:"single", featured:false, emoji:"🎚️", thumb:null },
      { repo:"dante", title:"Dante", desc:"Hands-on Dante networking activities for broadcast, walkie-talkies, loopback, and live audio routing.", section:"classroom", kind:"single", featured:false, emoji:"🔗", thumb:null },
      { repo:"eq-webapp", title:"EQ Webapp", desc:"Identify filters by ear across solo, 2-player, and 3-player modes.", section:"classroom", kind:"single", featured:false, emoji:"🎛️", thumb:"eq-webapp" },

      { repo:"mid-side", title:"Mid/Side Processing", desc:"Lessons, playground, and quiz on mid/side encoding and stereo width.", section:"classroom", kind:"single", featured:false, emoji:"↔️", thumb:"mid-side" },
      { repo:"sidechain", title:"Sidechain Compression", desc:"Learn pumping, ducking, de-essing, and mix glue — interactively.", section:"classroom", kind:"single", featured:false, emoji:"⛓️", thumb:"sidechain" },

      { repo:"multiband-game", title:"Multiband Mayhem", desc:"The game version of multiband compression — split the spectrum, save the snacks.", section:"classroom", kind:"single", featured:false, emoji:"🕹️", thumb:"multiband-game" },

      { repo:"misc-music-webapps", title:"Misc Music Webapps", desc:"The full collection this pulls from: key finder, chord tools, note detection, and more.", section:"instruments", kind:"multi", featured:false, emoji:"🎚️", thumb:"misc-music-webapps-collection" },

      { repo:"turangalila", title:"Turangalîla", desc:"An interactive listener's guide to Messiaen's Turangalîla-Symphonie.", section:"education", kind:"single", featured:false, emoji:"🌌", thumb:"turangalila" },
      { repo:"turandot", title:"Turandot: The Video Game", desc:"An interactive journey through Puccini's unfinished opera — riddles, arias, and the story behind it.", section:"education", kind:"single", featured:false, emoji:"🎭", thumb:"turandot" },
      { repo:"from-japan", title:"8 Tiny Japanese Habits", desc:"One YouTube video, rebuilt three different ways — video, slide deck, and ambient screensaver.", section:"education", kind:"single", featured:false, emoji:"🎌", thumb:"from-japan" },
      { repo:"camera-lab", title:"Camera Lab", desc:"A museum-floor style video camera simulator for learning exposure, motion, focus, and color.", section:"education", kind:"single", featured:false, emoji:"🎥", thumb:null },
      { repo:"mus248", title:"MUS 248 Activities", desc:"Weekly quizzes, study cards, worksheets, and hands-on A/V concert-recording activities in one course hub.", section:"education", kind:"multi", featured:false, emoji:"🎬", thumb:null },
      { repo:"sight-reading", title:"Sight Reading", desc:"A procedural sight-reading and sight-singing practice tool that generates new notation on demand.", section:"education", kind:"single", featured:false, emoji:"🎼", thumb:null },
      { repo:"quiz", title:"Quiz", desc:"A cleaner quiz-taking tool built for Music Technology courses at Chapman University.", section:"education", kind:"single", featured:false, emoji:"📝", thumb:"quiz" },
      { repo:"misc-music-webapps", title:"Note Detection", desc:"A real-time note detector and lead-sheet transcriber — v2 adds a live spectrogram view.", section:"education", kind:"single", featured:false, emoji:"📈", thumb:"misc-music-webapps-note-detection", liveOverride:`${PAGES_ROOT}/misc-music-webapps/note_detection_v2.html` },
      { repo:"hopfield1", title:"Hopfield", desc:"A neural network that listens to itself — grab, wiggle, and watch neurons argue into a chord.", section:"concept", kind:"single", featured:false, emoji:"🔗", thumb:"hopfield1" },
      { repo:"hopfield2", title:"Hopfield Harmonics", desc:"A second pass at the Hopfield experiment — a neural memory tuned by consonance.", section:"concept", kind:"single", featured:false, emoji:"🔀", thumb:"hopfield2" },
      { repo:"consciousness", title:"Consciousness", desc:"Thinking outside the cube, literally — a visual metaphor mapping altered states to spatial dimensions.", section:"concept", kind:"single", featured:false, emoji:"🧠", thumb:"consciousness" },
      { repo:"optics", title:"Optics", desc:"Prismatic lenses, caustics, and drifting light, inspired by Olafur Eliasson's \"Pluriverse assembly.\"", section:"concept", kind:"multi", featured:false, emoji:"🔮", thumb:"optics" },
      { repo:"spirograph", title:"Spirograph", desc:"Generative drawing and animation sketches built from looping geometric motion.", section:"concept", kind:"single", featured:false, emoji:"🌀", thumb:null }
    ];

    const sectionMetaById = Object.fromEntries(SECTIONS.map((s) => [s.id, s]));

    function repoUrl(app){
      return app.repoOverride || `https://github.com/${USER}/${app.repo}`;
    }

    function liveUrl(app){
      return app.liveOverride || `${PAGES_ROOT}/${app.repo}/`;
    }

    function escapeHtml(value){
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function isChapmanApp(app){
      return Boolean(app.chapman || app.section === "classroom" || app.section === "education");
    }

    function appStatus(app){
      if(app.lifecycle === "archive") return "Legacy / Archive";
      if(app.featured) return "Featured";
      return "Current";
    }

    function statusKey(app){
      if(app.lifecycle === "archive") return "archive";
      if(app.featured) return "featured";
      return "current";
    }

    function badgesMarkup(app){
      const badges = [];
      if(isChapmanApp(app)) badges.push(["Chapman", "chapman"]);
      if(app.kind === "multi") badges.push(["Multi-part", ""]);
      if(app.lifecycle === "archive") badges.push(["Archive", "archive"]);
      else if(app.featured) badges.push(["Featured", "featured"]);
      return badges.map(([label, tone]) => `
        <span class="badge ${tone ? `badge-${tone}` : ""}">${escapeHtml(label)}</span>
      `).join("");
    }

    function renderSectionPills(){
      const pillsEl = document.getElementById("sectionPills");
      pillsEl.innerHTML = SECTION_FILTERS.map((f) => `
        <button type="button" class="pill ${f.id === activeFilter ? "active" : ""}" data-filter="${escapeHtml(f.id)}">${escapeHtml(f.label)}</button>
      `).join("");
    }

    function renderFocusPills(){
      const pillsEl = document.getElementById("focusPills");
      pillsEl.innerHTML = FOCUS_FILTERS.map((f) => `
        <button type="button" class="pill ${f.id === activeFocusFilter ? "active" : ""}" data-focus="${escapeHtml(f.id)}">${escapeHtml(f.label)}</button>
      `).join("");
    }

    function rowMarkup(app){
      const src = app.thumb ? `assets/thumbs/${app.thumb}.jpg` : null;
      const thumb = src
        ? `<img src="${src}" alt="" loading="lazy" />`
        : escapeHtml(app.emoji || "✨");
      return `
        <tr>
          <td class="app-cell">
            <div class="app-main">
              <div class="row-thumb">${thumb}</div>
              <div>
                <p class="app-title">${escapeHtml(app.title)}</p>
                <p class="app-desc">${escapeHtml(app.desc)}</p>
                <div class="badge-row">${badgesMarkup(app)}</div>
              </div>
            </div>
          </td>
          <td class="table-meta">
            <strong>${escapeHtml(sectionMetaById[app.section]?.label || app.section)}</strong>
            ${escapeHtml(sectionMetaById[app.section]?.description || "")}
          </td>
          <td class="table-meta">
            <strong>${escapeHtml(appStatus(app))}</strong>
            ${isChapmanApp(app) ? "Suitable for Chapman-facing course delivery and Canvas-friendly browsing." : "Public-facing live app for general browsing."}
          </td>
          <td>
            <div class="row-actions">
              <a href="${liveUrl(app)}" target="_blank" rel="noreferrer">${app.kind === "multi" ? "Browse ↗" : "Open ↗"}</a>
              ${isChapmanApp(app) ? `<a href="${liveUrl(app)}" target="_blank" rel="noreferrer">Chapman ↗</a>` : ""}
              <a href="${repoUrl(app)}" target="_blank" rel="noreferrer">GitHub ↗</a>
            </div>
          </td>
        </tr>
      `;
    }

    let activeFilter = "all";
    let activeFocusFilter = "all";
    let statusTimer = null;
    const rowsEl = document.getElementById("rows");
    const emptyStateEl = document.getElementById("emptyState");
    const queryInput = document.getElementById("q");
    const resultSummaryEl = document.getElementById("resultSummary");
    const statusEl = document.getElementById("status");

    function searchText(app){
      return [
        app.title,
        app.desc,
        app.repo,
        sectionMetaById[app.section]?.label || "",
        appStatus(app),
        isChapmanApp(app) ? "Chapman Canvas" : "",
        app.kind === "multi" ? "multi multipart collection" : "single"
      ].join(" ").toLowerCase();
    }

    function getVisibleApps(){
      const query = (queryInput.value || "").trim().toLowerCase();
      return APPS.filter((app) => {
        const matchesFilter = activeFilter === "all" || app.section === activeFilter;
        const matchesFocus =
          activeFocusFilter === "all"
          || (activeFocusFilter === "chapman" && isChapmanApp(app))
          || (activeFocusFilter === "featured" && statusKey(app) === "featured")
          || (activeFocusFilter === "current" && statusKey(app) === "current")
          || (activeFocusFilter === "archive" && statusKey(app) === "archive")
          || (activeFocusFilter === "multi" && app.kind === "multi");
        const matchesQuery = !query || searchText(app).includes(query);
        return matchesFilter && matchesFocus && matchesQuery;
      });
    }

    function setStatus(message){
      statusEl.textContent = message || "";
      if(statusTimer) window.clearTimeout(statusTimer);
      if(message){
        statusTimer = window.setTimeout(() => { statusEl.textContent = ""; }, 4200);
      }
    }

    function renderRows(){
      const visible = getVisibleApps();
      rowsEl.innerHTML = visible.map(rowMarkup).join("");
      emptyStateEl.classList.toggle("hide", visible.length !== 0);
      const filterLabel = SECTION_FILTERS.find((f) => f.id === activeFilter)?.label || "All";
      const focusLabel = FOCUS_FILTERS.find((f) => f.id === activeFocusFilter)?.label || "Everything";
      resultSummaryEl.textContent = `Showing ${visible.length} of ${APPS.length} (${filterLabel} • ${focusLabel}).`;
    }

    document.getElementById("sectionPills").addEventListener("click", (e) => {
      const pill = e.target.closest("[data-filter]");
      if(!pill) return;
      activeFilter = pill.getAttribute("data-filter") || "all";
      renderSectionPills();
      renderRows();
    });

    document.getElementById("focusPills").addEventListener("click", (e) => {
      const pill = e.target.closest("[data-focus]");
      if(!pill) return;
      activeFocusFilter = pill.getAttribute("data-focus") || "all";
      renderFocusPills();
      renderRows();
    });

    queryInput.addEventListener("input", renderRows);

    document.getElementById("btnOpenVisible").addEventListener("click", async () => {
      const visible = getVisibleApps();
      if(!visible.length){
        setStatus("No visible apps to open right now.");
        return;
      }
      const urls = visible.map(liveUrl);
      window.open(urls[0], "_blank", "noopener,noreferrer");
      if(urls.length === 1){
        setStatus("Opened the only visible app.");
        return;
      }
      const remainder = urls.slice(1).join("\n");
      try{
        await navigator.clipboard.writeText(remainder);
        setStatus(`Opened 1 app and copied ${urls.length - 1} more visible URLs to the clipboard.`);
      } catch (error){
        setStatus(`Opened 1 app. Clipboard copy was blocked, so the other ${urls.length - 1} links were not copied.`);
      }
    });

    renderSectionPills();
    renderFocusPills();
    renderRows();
  </script>
</body>
</html>
